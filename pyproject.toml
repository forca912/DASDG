[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dasdg"
version = "1.0.2"
description = "Auditable traffic-flow forecasting under persistent sensor missingness"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26,<3", "torch>=2.3,<2.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
